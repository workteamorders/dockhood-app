# Server override for docker-compose.testnet.yml: adds the API, worker and an HTTPS reverse proxy (Caddy).
# Run from the repo root:
#   docker compose -f docker-compose.testnet.yml -f deploy/server/docker-compose.server.yml \
#     --env-file deploy/server/.env --profile indexer up -d --build
# deploy/server/setup.sh does this for you on a fresh Ubuntu server. See docs/DEPLOY-SERVER.md.
x-api: &api
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: dockhood-api:latest
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    hasura:
      condition: service_healthy
  environment: &api-env
    HOST: 0.0.0.0
    PORT: "8787"
    CHAIN_ID: "46630"
    RPC_URL_SERVER: ${TESTNET_RPC_URL:?set TESTNET_RPC_URL}
    DATABASE_URL: postgres://hood:hood@postgres:5432/hood
    REDIS_URL: redis://redis:6379
    ENVIO_GRAPHQL_URL: http://hasura:8080/v1/graphql
    INDEXER_DATABASE_URL: postgres://hood:hood@postgres:5432/envio
    TOKEN_INDEX: "on"
    STAND_INS: allow
    PONS_LAUNCH_FACTORY: ${TESTNET_FACTORY_ADDRESS:?set TESTNET_FACTORY_ADDRESS}
    PONS_LAUNCH_AND_BUY: "0x48DD574A31C842b177c3582d2469506964C867ae"
    PAIR_TOKENS_JSON: "[]"
    RIGOR_REGISTRY_ADDRESS: "0xB97b5A72BD6D508E5376F10D740f67C7C6ab33D0"
    VERIFICATION_POOL_ADDRESS: "0x3C741cF3BB5b6cee06f30320cdBA489aEfDD7AE2"
    FEE_SPLITTER_ADDRESS: "0x0A7A90e3863D66393B1A97ceAd5700A3f6cEd44c"
    VERIFICATION_SUBMISSIONS_ENABLED: "false"
    VERIFICATION_SUBMISSION_FEE_WEI: "10000000000000"
    ADMIN_WALLETS: "0xCD8589e80a6e3C99C42A722606052A5F91076dd1"
    CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
    SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
    PROXY_SECRET: ${PROXY_SECRET:?set PROXY_SECRET}

services:
  api:
    <<: *api
    expose:
      - "8787"
  worker:
    <<: *api
    environment:
      <<: *api-env
      HOOD_PROCESS: worker
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${API_HOST:?set API_HOST} --to api:8787
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
